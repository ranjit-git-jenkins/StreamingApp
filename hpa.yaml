{{- if .Values.hpa.enabled }}
{{- range .Values.services }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamingapp-{{ .name }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: streamingapp-{{ .name }}}
  minReplicas: {{ $.Values.hpa.minReplicas }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $.Values.hpa.averageUtilization }} }
{{- end }}
{{- end }}
