{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamingapp-{{ .name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels: {app: streamingapp-{{ .name }}}
  template:
    metadata:
      labels: {app: streamingapp-{{ .name }}}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.global.registry }}/streamingapp-{{ .name }}:{{ $.Values.global.tag }}"
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: {{ .port }} }]
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- if ne .name "frontend" }}
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: {name: streamingapp-secrets, key: mongo-uri}
          {{- end }}
{{- end }}
